<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股波段量化選股終端 (TW Full-Market Screener)</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --border-color: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --tw-up: #ef4444;     /* 台股漲/突破：紅色 */
      --tw-down: #10b981;   /* 台股跌/防守：綠色 */
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container { max-width: 1300px; margin: 0 auto; }

    /* Header & Stats */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .header-title h1 { font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
    .header-title p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
    
    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .status-badge {
      font-size: 0.75rem;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 8px;
    }
    .stat-card .label { font-size: 0.8rem; color: var(--text-muted); }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 0.25rem; }

    /* Controls & Filter Bar */
    .controls-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
    }
    .tabs-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .tab-btn {
      background: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }
    .search-sort-group { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .input-field, .select-field {
      background: #1f2937;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
    }
    .input-field:focus, .select-field:focus { border-color: var(--accent-blue); }

    /* Table / Grid */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    thead tr { background: #1a2234; border-bottom: 1px solid var(--border-color); }
    th, td { padding: 0.85rem 1rem; white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.05em; }
    tbody tr { border-bottom: 1px solid rgba(55, 65, 81, 0.5); transition: background 0.15s; }
    tbody tr:hover { background: var(--bg-card-hover); }

    /* Badges & Links */
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      margin-right: 0.25rem;
    }
    .badge-vcp { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-pullback { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .badge-reversal { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }

    /* External Links Badge */
    .ext-link {
      font-size: 0.65rem;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .ext-link:hover { opacity: 1; }
    .tv-link { background: #2962ff; color: #fff; }
    .pyr-link { background: #d97706; color: #fff; }

    .sparkline-svg { vertical-align: middle; }
    .action-btn {
      background: #1f2937;
      color: #93c5fd;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .action-btn:hover { background: #2563eb; color: #fff; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 90%; max-width: 480px; padding: 1.5rem;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .form-group input { width: 100%; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="header-title">
      <h1>📈 台股波段純多頭量化選股終端</h1>
      <p>涵蓋 TWSE / TPEx 全市場 1,800+ 標的 | 鎖定 VCP 突破、強勢回測、底部扭轉</p>
    </div>
    <div class="header-actions">
      <!-- 歷史紀錄下拉選單，預設隱藏，由 JS 判斷是否有紀錄後顯示 -->
      <select id="dateSelect" class="select-field" style="display: none; font-weight: 600; color: #60a5fa;"></select>
      <span class="status-badge" id="updateTimeBadge">載入中...</span>
      <button class="action-btn" onclick="exportCSV()">匯出 CSV</button>
    </div>
  </header>

  <!-- Summary Stats -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="label">全市場入選標的</div>
      <div class="value" id="totalCandidates">-</div>
    </div>
    <div class="stat-card">
      <div class="label">VCP 壓縮突破</div>
      <div class="value" style="color: #f87171;" id="countVCP">-</div>
    </div>
    <div class="stat-card">
      <div class="label">強勢股回後買</div>
      <div class="value" style="color: #60a5fa;" id="countPullback">-</div>
    </div>
    <div class="stat-card">
      <div class="label">底部底底高扭轉</div>
      <div class="value" style="color: #fbbf24;" id="countReversal">-</div>
    </div>
  </div>

  <!-- Filter & Search Toolbar -->
  <div class="controls-panel">
    <div class="tabs-group" id="strategyTabs">
      <button class="tab-btn active" data-filter="ALL">全部策略</button>
      <button class="tab-btn" data-filter="VCP_BREAKOUT">🔥 VCP 突破</button>
      <button class="tab-btn" data-filter="PULLBACK_BUY">🎯 回測月線買</button>
      <button class="tab-btn" data-filter="BOTTOM_REVERSAL">⚡ 底部翻揚</button>
    </div>

    <div class="search-sort-group">
      <input type="text" id="searchInput" class="input-field" placeholder="搜尋代碼或股名...">
      <select id="sortSelect" class="select-field">
        <option value="vol_desc">成交量 (大至小)</option>
        <option value="price_desc">收盤價 (高至低)</option>
        <option value="price_asc">收盤價 (低至高)</option>
      </select>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>標的代碼 / 名稱</th>
          <th>收盤價</th>
          <th>成交量 (張)</th>
          <th>符合策略</th>
          <th>關鍵觀察位階 / 樞紐</th>
          <th>建議防守停損</th>
          <th>近 15 日走勢</th>
          <th>風控計算</th>
        </tr>
      </thead>
      <tbody id="screenerTableBody">
        <tr><td colspan="8" class="empty-state">資料載入中，請稍候...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Risk & Position Calculator Modal -->
<div class="modal-overlay" id="calcModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="calcModalTitle">部位風控計算機</h3>
      <button class="modal-close" onclick="closeCalcModal()">&times;</button>
    </div>
    <div class="form-group">
      <label>總投資本金 (NTD)</label>
      <input type="number" id="calcAccountSize" class="input-field" value="1000000" step="50000">
    </div>
    <div class="form-group">
      <label>單筆交易最大容忍虧損比例 (%)</label>
      <input type="number" id="calcRiskPercent" class="input-field" value="1.0" step="0.1">
    </div>
    <div class="form-group">
      <label>買進價格 (NTD)</label>
      <input type="number" id="calcEntryPrice" class="input-field">
    </div>
    <div class="form-group">
      <label>停損價格 (NTD)</label>
      <input type="number" id="calcStopLoss" class="input-field">
    </div>

    <div style="background: #1a2234; padding: 1rem; border-radius: 6px; margin-top: 1rem;">
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem;">單筆最大承受損失: <b id="calcMaxLoss" style="color: #ef4444;">-</b></div>
      <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem;">每股潛在風險: <b id="calcRiskPerShare">-</b></div>
      <div style="font-size: 1rem; color: #60a5fa; margin-top: 0.5rem; font-weight: 700;">建議購買股數: <span id="calcSuggestedShares">-</span> 股 (<span id="calcSuggestedLots">-</span> 張)</div>
    </div>
  </div>
</div>

<script>
  let rawData = [];
  let currentFilter = "ALL";
  let isHistoricalView = false; // 判斷是否正在查看歷史紀錄

  // ... (FALLBACK_DATA 等常數保留) ...

  async function boot() {
    const dateSelect = document.getElementById("dateSelect");
    try {
      const res = await fetch('./history/index.json?t=' + Date.now());
      if (res.ok) {
        const dates = await res.json();
        if (dates && dates.length > 0) {
          dateSelect.style.display = "inline-block";
          dateSelect.innerHTML = `<option value="./data.json">🌟 最新覆蓋版</option>`;
          dates.forEach(date => {
            dateSelect.innerHTML += `<option value="./history/${date}.json">📅 歷史: ${date}</option>`;
          });
          
          dateSelect.addEventListener("change", (e) => {
             // 如果選擇的不是最新覆蓋版，就標記為歷史檢視模式
             isHistoricalView = e.target.value !== "./data.json";
             loadData(e.target.value);
          });
        }
      }
    } catch (e) {
      console.log("尚未建立歷史索引，維持單一資料模式。");
    }
    loadData('./data.json');
  }

  async function loadData(url) {
    document.getElementById("screenerTableBody").innerHTML = `<tr><td colspan="9" class="empty-state">資料載入中，請稍候...</td></tr>`;
    try {
      const fetchUrl = url.includes('?') ? url : url + '?t=' + Date.now();
      const response = await fetch(fetchUrl);
      if (!response.ok) throw new Error("HTTP error " + response.status);
      let data = await response.json();
      
      // 如果是歷史檢視模式，抓取最新報價來計算績效
      if (isHistoricalView) {
          document.getElementById("screenerTableBody").innerHTML = `<tr><td colspan="9" class="empty-state">正在計算歷史績效，請稍候...</td></tr>`;
          data = await appendCurrentPerformance(data);
      }
      
      initDashboard(data);
    } catch (e) {
      console.warn(`未能在 ${url} 取得資料，切換至擬真展示資料模式：`, e);
      initDashboard(FALLBACK_DATA);
    }
  }

  // --- 新增：即時抓取最新報價計算績效 ---
  async function appendCurrentPerformance(data) {
    if (!data.results || data.results.length === 0) return data;
    
    // 收集所有股票代號 (轉換為 Yahoo Finance 格式)
    const tickers = data.results.map(r => r.ticker).join(',');
    
    try {
        // 使用公開的 Yahoo Finance API 代理 (注意：實務上建議自己架設簡單的代理伺服器)
        // 這裡作為概念驗證，使用一個常見的免費代理。
        // 若此代理失效，請尋找其他可用的股價 API。
        const proxyUrl = 'https://corsproxy.io/?'; 
        const yfUrl = encodeURIComponent(`https://query1.finance.yahoo.com/v7/finance/quote?symbols=${tickers}`);
        
        const response = await fetch(proxyUrl + yfUrl);
        const yfData = await response.json();
        
        if (yfData.quoteResponse && yfData.quoteResponse.result) {
            const quotes = {};
            yfData.quoteResponse.result.forEach(q => {
                quotes[q.symbol] = q.regularMarketPrice;
            });
            
            // 將最新價格和漲跌幅寫回 data
            data.results.forEach(item => {
                const currentPrice = quotes[item.ticker];
                if (currentPrice) {
                    item.current_price = currentPrice;
                    item.performance = ((currentPrice - item.close) / item.close) * 100;
                } else {
                    item.performance = null; // 無法取得最新價格
                }
            });
        }
    } catch (error) {
        console.error("無法取得最新報價計算績效:", error);
    }
    return data;
  }

  function initDashboard(data) {
    document.getElementById("updateTimeBadge").textContent = "選股日期: " + (data.updated_at || "即時");
    rawData = data.results || [];
    
    // ... (統計數據更新邏輯保留) ...

    // 動態調整表格標題：如果是歷史檢視，增加「至今績效」欄位
    const theadTr = document.querySelector("thead tr");
    if (isHistoricalView && !document.getElementById("perfHeader")) {
         theadTr.innerHTML += `<th id="perfHeader">至今績效 (報價延遲)</th>`;
    } else if (!isHistoricalView && document.getElementById("perfHeader")) {
         document.getElementById("perfHeader").remove();
    }

    renderTable();
  }

  // ... (generateSparkline 等保留) ...

  function renderTable() {
    const tbody = document.getElementById("screenerTableBody");
    // ... (篩選與排序邏輯保留) ...

    tbody.innerHTML = filtered.map(item => {
      // ... (既有徽章、停損計算等保留) ...

      // --- 新增：渲染績效欄位 ---
      let perfCell = '';
      if (isHistoricalView) {
          if (item.performance !== undefined && item.performance !== null) {
              const color = item.performance > 0 ? '#ef4444' : (item.performance < 0 ? '#10b981' : 'var(--text-muted)');
              const sign = item.performance > 0 ? '+' : '';
              perfCell = `<td style="color: ${color}; font-weight: 700;">${sign}${item.performance.toFixed(2)}%<br><span style="font-size: 0.7rem; color: var(--text-muted); font-weight: normal;">現價: ${item.current_price.toFixed(2)}</span></td>`;
          } else {
              perfCell = `<td style="color: var(--text-muted);">無資料</td>`;
          }
      }

      return `
        <tr>
          <!-- ... (前面欄位保留) ... -->
          <td>${generateSparkline(item.chart_history)}</td>
          <td>
            <button class="action-btn" onclick="openCalcModal('${item.ticker}', '${item.name}', ${item.close}, ${stopLoss !== '-' ? stopLoss : (item.close * 0.95).toFixed(2)})">部位試算</button>
          </td>
          ${perfCell}
        </tr>
      `;
    }).join("");
  }

  // ... (事件監聽與試算機邏輯保留) ...

  boot();
</script>
</body>
</html>
