name: Daily Taiwan Stock Screener

on:
  schedule:
    # 台灣時間週一至週五 15:30 (UTC 07:30)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    # 新增手動觸發時的「強制執行」選項
    inputs:
      force_run:
        description: '強制重新執行 (無視今天是否已經產生過檔案)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy yfinance requests lxml

      - name: Run Full-Market Screener
        run: |
          # 判斷是否勾選了強制執行，若有則加上 --force 參數傳給 Python
          if [ "${{ github.event.inputs.force_run }}" == "true" ]; then
            python screener.py --force
          else
            python screener.py
          fi

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: update daily screener results [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit (可能是跳過執行或資料無異動)."
          fi
