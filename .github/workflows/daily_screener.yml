name: Daily Taiwan Stock Screener

on:
  schedule:
    # 台灣時間週一至週五 15:30 (UTC 07:30)
    - cron: '33 8 * * 1-5'
  workflow_dispatch: # 支援手動一鍵點擊執行

# 授權 GitHub Actions 寫入權限，才能成功 Push 回倉庫
permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy yfinance requests lxml

      - name: Run Full-Market Screener
        run: |
          python screener.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # 檢查是否有檔案變動，如果有才執行 commit 與 push
          if ! git diff --staged --quiet; then
            git commit -m "chore: update daily screener results [skip ci]"
            # 先拉取遠端最新變更並合併，避免版本衝突
            git pull --rebase origin main
            # 推播回 GitHub
            git push
          else
            echo "No changes to commit."
          fi
